<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Source Sans Pro", -apple-system, "Segoe UI", sans-serif; }
  #pick {
    width: 100%; height: 44px; font-size: 16px; cursor: pointer;
    background: #f0f2f6; color: #31333f; border: 1px solid rgba(49, 51, 63, 0.2); border-radius: 8px;
  }
  #pick:active { background: #e0e3ea; }
  #status { margin: 6px 2px 0; font-size: 14px; color: #808495; min-height: 18px; }
</style>
</head>
<body>
  <button id="pick" type="button">📁 폴더 선택</button>
  <div id="status"></div>
  <input id="file" type="file" webkitdirectory directory multiple style="display:none" />
<script>
  // Streamlit 컴포넌트 통신 (외부 라이브러리 없이 메시지만 주고받음)
  function post(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: 80 });

  var EXT = /\.(jpe?g|png|heic|heif|webp|bmp|gif|tiff?)$/i;
  var MAX_SIDE = 1600;   // 긴 변 최대 px (전송량을 줄이기 위해 축소)
  var QUALITY = 0.88;
  var MAX_FILES = 100;   // 한 번에 불러올 최대 장수

  var btn = document.getElementById("pick");
  var input = document.getElementById("file");
  var statusEl = document.getElementById("status");

  btn.addEventListener("click", function () { input.click(); });

  function naturalCompare(a, b) {
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }

  async function toJpegDataUrl(file) {
    var src = null;
    try {
      // 사진 회전 정보(EXIF)를 반영해서 읽기
      src = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch (e) { src = null; }
    if (!src) { src = await loadImage(file); }
    var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    canvas.getContext("2d").drawImage(src, 0, 0, cw, ch);
    if (src.close) { src.close(); }
    return canvas.toDataURL("image/jpeg", QUALITY);
  }

  input.addEventListener("change", async function () {
    var all = Array.prototype.slice.call(input.files || []);
    var files = all.filter(function (f) { return EXT.test(f.name); });
    if (!files.length) { statusEl.textContent = "불러올 사진이 없습니다."; return; }
    files.sort(function (a, b) { return naturalCompare(a.name, b.name); });
    var note = "";
    if (files.length > MAX_FILES) { files = files.slice(0, MAX_FILES); note = " (처음 " + MAX_FILES + "장만)"; }

    var out = [], failed = [];
    for (var i = 0; i < files.length; i++) {
      statusEl.textContent = "사진 준비 중 " + (i + 1) + "/" + files.length;
      try {
        out.push({ name: files[i].name, data: await toJpegDataUrl(files[i]) });
      } catch (e) { failed.push(files[i].name); }
    }
    statusEl.textContent = out.length + "장 불러옴" + note + (failed.length ? " · 실패 " + failed.length + "장" : "");
    post("streamlit:setComponentValue", {
      value: { id: Date.now() + "-" + Math.random().toString(36).slice(2), files: out, failed: failed },
      dataType: "json"
    });
    input.value = "";
  });
</script>
</body>
</html>
